services:
  cordbrief-collector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cordbrief-collector-spike
    restart: unless-stopped
    shm_size: "1gb"
    user: "1000:1000"
    ports:
      # Expose Xpra HTML5 canvas exclusively to localhost
      - "127.0.0.1:14500:14500"
    environment:
      # Comma-separated list of channel IDs to watch: test-a, test-b
      - CORDBRIEF_WATCHED_CHANNELS=1545115236619518014,1545115308556030042
      - CORDBRIEF_JOURNAL_PATH=/var/cordbrief/journal/discord_events.ndjson
      - XPRA_PORT=14500
      - DISPLAY=:100
    volumes:
      # Discord user profile and session storage
      - discord_profile_data:/home/cordbrief/.config/discord
      # D-Bus Secret Service (gnome-keyring) storage
      - discord_keyring_data:/home/cordbrief/.local/share/keyrings
      # Shared NDJSON journal volume for CordBrief Core
      - cordbrief_journal_data:/var/cordbrief/journal

volumes:
  discord_profile_data:
    name: cordbrief_spike_discord_profile
  discord_keyring_data:
    name: cordbrief_spike_keyring
  cordbrief_journal_data:
    name: cordbrief_spike_journal
