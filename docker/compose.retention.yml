# Opt-in offline evidence maintenance. Ordinary collector retains no Core-private access.
# Combine with compose.yml; stop Core and Collector first.
# Run with:
#   docker compose -f docker/compose.yml -f docker/compose.retention.yml run --rm cordbrief-collector bash /home/cordbrief/collector/retention-publish.sh <closed-prefix-end>
# Default publishes evidence only. An additional --delete-certified explicitly
# deletes the already certified prefix after fresh locked validation.
services:
  cordbrief-collector:
    environment:
      - CORDBRIEF_CORE_DATA_DIR=/var/cordbrief/data
    volumes:
      - core_data:/var/cordbrief/data

volumes:
  core_data:
