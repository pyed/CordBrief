# CordBrief Architecture v2: Two-Service Production Docker Compose Foundation
#
# Security Boundary:
# - cordbrief-collector: Runs Discord Desktop + Vencord. Has Discord profile/keyring/session access.
#   Has NO access to LLM credentials, prompts, or delivery secrets.
# - cordbrief-core: Runs Go core application. Reads journal events and manages watchlist.
#   Has NO access to Discord profile, session storage, or keyring.
# - The ONLY integration between services is the shared filesystem exchange volume.

services:
  # 1. Ingestion Service: Official Discord Desktop + Vencord Collector
  cordbrief-collector:
    build:
      context: ../collector
      dockerfile: Dockerfile
    container_name: cordbrief-collector
    restart: unless-stopped
    shm_size: "1gb"
    user: "1000:1000"
    ports:
      # Expose Xpra HTML5 client exclusively to localhost for first-time login
      - "127.0.0.1:14500:14500"
    environment:
      - CORDBRIEF_EXCHANGE_DIR=/var/cordbrief/exchange
      - XPRA_PORT=14500
      - DISPLAY=:100
    volumes:
      # Persistent Discord authenticated session & profile
      - cordbrief_discord_profile:/home/cordbrief/.config/discord
      # Persistent GNOME Keyring for Discord secret token storage
      - cordbrief_discord_keyring:/home/cordbrief/.local/share/keyrings
      # Shared filesystem exchange (events, status, watchlist, catalog)
      - cordbrief_exchange:/var/cordbrief/exchange
      # Collector-private CordBrief application data (recovery state, internal metadata)
      - cordbrief_collector_data:/var/lib/cordbrief
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const fs=require(\"fs\"); const s=JSON.parse(fs.readFileSync(\"/var/cordbrief/exchange/collector-status.json\")); if(Date.now()-new Date(s.updated_at).getTime()>30000) process.exit(1);' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # 2. Core Service: Journal consumer, watchlist manager, and future summarization/delivery
  cordbrief-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    container_name: cordbrief-core
    restart: unless-stopped
    depends_on:
      - cordbrief-collector
    user: "1000:1000"
    command: ["serve"]
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - CORDBRIEF_EXCHANGE_DIR=/var/cordbrief/exchange
      - CORDBRIEF_DATA_DIR=/var/cordbrief/data
      - GEMINI_API_KEY
      - CORDBRIEF_LLM_PROVIDER
      - CORDBRIEF_LLM_BASE_URL
      - CORDBRIEF_LLM_MODEL
      - CORDBRIEF_LLM_API_KEY
    volumes:
      # Shared filesystem exchange (reads events/status/catalog, writes watchlist/core-ack)
      - cordbrief_exchange:/var/cordbrief/exchange
      # Core internal data and state
      - cordbrief_core_data:/var/cordbrief/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  # Shared exchange volume (inter-service boundary)
  cordbrief_exchange:
    name: cordbrief_exchange
  # Collector-private Discord profile & keyring
  cordbrief_discord_profile:
    name: cordbrief_discord_profile
  cordbrief_discord_keyring:
    name: cordbrief_discord_keyring
  # Collector-private application data
  cordbrief_collector_data:
    name: cordbrief_collector_data
  # Core-private application data
  cordbrief_core_data:
    name: cordbrief_core_data
