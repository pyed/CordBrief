# CordBrief Official Discord RPC Architecture
#
# Services:
# - cordbrief-collector: Official unmodified Discord desktop client + local RPC collector daemon
#   Exposes Xpra shadow viewer on 127.0.0.1:28742 exclusively for interactive setup/OAuth authorization.
# - cordbrief-core: Go core service reading journal events, updating watchlist, serving web UI on 127.0.0.1:28741.

name: cordbrief

services:
  cordbrief-collector:
    image: docker-cordbrief-collector:latest
    build:
      context: ../collector
      dockerfile: Dockerfile
    restart: unless-stopped
    shm_size: "1gb"
    user: "1000:1000"
    ports:
      - "127.0.0.1:28742:28742"
    env_file:
      - path: ../.env
        required: false
    environment:
      - CORDBRIEF_EXCHANGE_DIR=/var/cordbrief/exchange
      - CORDBRIEF_COLLECTOR_DATA_DIR=/var/lib/cordbrief
      - CORDBRIEF_RUNTIME_DIR=/var/cordbrief/runtime
      - XDG_RUNTIME_DIR=/tmp/runtime-cordbrief
      - DISPLAY=:100
    volumes:
      - discord_runtime:/var/cordbrief/runtime
      - discord_profile:/home/cordbrief/.config/discord
      - discord_keyring:/home/cordbrief/.local/share/keyrings
      - exchange:/var/cordbrief/exchange
      - collector_data:/var/lib/cordbrief
    healthcheck:
      test: ["CMD-SHELL", "node -e 'const fs=require(\"fs\"); const s=JSON.parse(fs.readFileSync(\"/var/cordbrief/exchange/collector-status.json\")); if(Date.now()-new Date(s.updated_at).getTime()>30000) process.exit(1);' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

  cordbrief-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.core
    restart: unless-stopped
    depends_on:
      - cordbrief-collector
    user: "1000:1000"
    command: ["serve"]
    ports:
      - "127.0.0.1:28741:28741"
    env_file:
      - path: ../.env
        required: false
    environment:
      - CORDBRIEF_EXCHANGE_DIR=/var/cordbrief/exchange
      - CORDBRIEF_DATA_DIR=/var/cordbrief/data
      - CORDBRIEF_WEB_PORT=28741
    volumes:
      - exchange:/var/cordbrief/exchange
      - core_data:/var/cordbrief/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:28741/ > /dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  discord_runtime:
  exchange:
  discord_profile:
  discord_keyring:
  collector_data:
  core_data:
